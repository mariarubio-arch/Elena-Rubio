<script>
        // Mock Database for dropdown demo
        const mockDatabase = [
            { eco: 'ECO-012', placas: 'JKL-9012', modelo: '2022', marca: 'Nissan Versa', vin: '3N1CN7AP5KL123XXX' },
            { eco: 'ECO-015', placas: 'MNO-3456', modelo: '2023', marca: 'Chevrolet Aveo', vin: '3G1AL5E21MS456XXX' },
            { eco: 'ECO-022', placas: 'PQR-7890', modelo: '2021', marca: 'Toyota Hilux', vin: 'MROFX22G5L1789XXX' }
        ];

        function fillVehicleData() {
            const select = document.getElementById('f-vehiculo-select');
            const idx = select.value;
            
            if (idx === "") {
                document.getElementById('f-eco').value = '';
                document.getElementById('f-placas').value = '';
                document.getElementById('f-marca').value = '';
                document.getElementById('f-modelo').value = '';
                document.getElementById('f-vin').value = '';
            } else {
                const data = mockDatabase[idx];
                document.getElementById('f-eco').value = data.eco;
                document.getElementById('f-placas').value = data.placas;
                document.getElementById('f-marca').value = data.marca;
                document.getElementById('f-modelo').value = data.modelo;
                document.getElementById('f-vin').value = data.vin;
            }
            updatePreview();
        }

        function updatePreview() {
            // Text sync mapping
            const map = {
                'f-nombre': ['p-nombre', 'p-sign-nombre'],
                'f-apellidos': ['p-apellidos'],
                'f-num-emp': ['p-num-emp'],
                'f-depto': ['p-depto'],
                'f-eco': ['p-eco'],
                'f-placas': ['p-placas'],
                'f-marca': ['p-marca'],
                'f-modelo': ['p-modelo'],
                'f-vin': ['p-vin']
            };

            for (const [inputId, targetIds] of Object.entries(map)) {
                let val = document.getElementById(inputId).value.trim();
                let fallback = inputId.includes('f-nombre') || inputId.includes('f-apellidos') || inputId.includes('f-depto') ? '__________________' : '----------';
                if(inputId === 'f-vin') fallback = '-----------------';
                if(inputId === 'f-num-emp') fallback = '_______';

                targetIds.forEach(tId => {
                    document.getElementById(tId).innerText = val || fallback;
                });
            }
        }

        // Canvas Signature Logic
        let canvas, ctx, isDrawing = false, lastX = 0, lastY = 0;

        window.onload = () => {
            initSignaturePad();
        };

        function initSignaturePad() {
            canvas = document.getElementById('signature-pad');
            ctx = canvas.getContext('2d');
            
            // Set exact dimensions based on CSS display size to avoid stretching
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Pen settings (Blue ink color)
            ctx.strokeStyle = '#1e3a8a'; 
            ctx.lineWidth = 2.5;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            // Events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // Touch events para móviles
            canvas.addEventListener('touchstart', startDrawingTouch, { passive: false });
            canvas.addEventListener('touchmove', drawTouch, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) { 
            isDrawing = true; 
            const pos = getPos(e); 
            lastX = pos.x; 
            lastY = pos.y; 
        }
        
        function startDrawingTouch(e) { 
            e.preventDefault(); 
            startDrawing(e); 
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            lastX = pos.x;
            lastY = pos.y;
        }
        
        function drawTouch(e) { 
            e.preventDefault(); 
            draw(e); 
        }

        // === FUNCIONES FALTANTES AÑADIDAS AQUÍ ABAJO ===

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            syncSignatureToDocument(); // Copiamos la firma al documento imprimible
        }

        function syncSignatureToDocument() {
            const signatureImg = document.getElementById('p-signature-img');
            // Convertimos lo que se dibujó en el canvas a una imagen en base64
            signatureImg.src = canvas.toDataURL('image/png');
            signatureImg.classList.remove('hidden'); // Mostramos la imagen en el documento final
        }

        function clearSignature() {
            // Limpiar el canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Limpiar y ocultar la imagen en el documento
            const signatureImg = document.getElementById('p-signature-img');
            signatureImg.src = "";
            signatureImg.classList.add('hidden');
        }
    </script>
